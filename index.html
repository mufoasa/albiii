<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Dental — Coming Soon</title>
<style>
  :root {
    --cream: #F5F2EE;
    --charcoal: #1C1C1A;
    --gold: #C8A97E;
    --stone: #9B9088;
    --mist: #E8E4DF;
    --mist-dark: #D8D3CC;
    --border: rgba(28,28,26,0.12);
    --border-gold: rgba(200,169,126,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--cream);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--charcoal);
  }

  .bg-dots {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
    max-width: 700px;
    width: 100%;
    text-align: center;
  }

  .brand {
    font-size: clamp(36px, 7vw, 58px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--charcoal);
    font-family: 'Georgia', serif;
    font-weight: 400;
    margin-bottom: 4px;
    line-height: 1;
  }

  .brand-rule {
    width: 100%;
    max-width: 420px;
    height: 1px;
    background: var(--border-gold);
    margin: 14px auto 14px;
  }

  .brand-sub {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 28px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 400;
    color: var(--charcoal);
    line-height: 1.18;
    letter-spacing: -0.01em;
    margin-bottom: 14px;
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .subtitle {
    font-size: 15px;
    color: var(--stone);
    line-height: 1.7;
    max-width: 380px;
    margin-bottom: 44px;
  }

  /* SCENE */
  .scene {
    position: relative;
    width: 340px;
    height: 260px;
    margin-bottom: 44px;
  }

  .tooth-svg {
    position: absolute;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    transform-origin: bottom center;
  }

  .tool {
    position: absolute;
    transform-origin: top center;
  }

  .tool-left {
    left: 40px;
    top: -10px;
    animation: smashLeft 1.6s linear infinite;
  }

  .tool-right {
    right: 40px;
    top: -10px;
    animation: smashRight 1.8s linear infinite 0.4s;
  }

  .tool-center {
    left: 50%;
    margin-left: -20px;
    top: -20px;
    animation: smashCenter 1.4s linear infinite 0.9s;
  }

  @keyframes smashLeft {
    0%   { transform: translateY(-30px) rotate(-15deg); opacity: 0.4; }
    35%  { transform: translateY(120px) rotate(-15deg); opacity: 1; }
    45%  { transform: translateY(115px) rotate(-15deg); opacity: 1; }
    55%  { transform: translateY(120px) rotate(-15deg); opacity: 1; }
    90%  { transform: translateY(-30px) rotate(-15deg); opacity: 0.4; }
    100% { transform: translateY(-30px) rotate(-15deg); opacity: 0.4; }
  }

  @keyframes smashRight {
    0%   { transform: translateY(-30px) rotate(15deg); opacity: 0.4; }
    35%  { transform: translateY(110px) rotate(15deg); opacity: 1; }
    45%  { transform: translateY(105px) rotate(15deg); opacity: 1; }
    55%  { transform: translateY(110px) rotate(15deg); opacity: 1; }
    90%  { transform: translateY(-30px) rotate(15deg); opacity: 0.4; }
    100% { transform: translateY(-30px) rotate(15deg); opacity: 0.4; }
  }

  @keyframes smashCenter {
    0%   { transform: translateY(-40px) scaleX(1); opacity: 0.3; }
    38%  { transform: translateY(100px) scaleX(1); opacity: 1; }
    48%  { transform: translateY(96px) scaleX(1.05); opacity: 1; }
    58%  { transform: translateY(100px) scaleX(1); opacity: 1; }
    92%  { transform: translateY(-40px) scaleX(1); opacity: 0.3; }
    100% { transform: translateY(-40px) scaleX(1); opacity: 0.3; }
  }

  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: sparkle 1.6s ease-out infinite;
    opacity: 0;
  }

  @keyframes sparkle {
    0%   { opacity: 0; transform: scale(0) translate(0,0); }
    40%  { opacity: 1; transform: scale(1) translate(0,0); }
    50%  { opacity: 0.9; }
    80%  { opacity: 0; transform: scale(0.3) translate(var(--dx), var(--dy)); }
    100% { opacity: 0; }
  }

  .divider {
    width: 48px;
    height: 1px;
    background: var(--border-gold);
    margin: 0 auto 28px;
  }

  .notify-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 12px;
    display: block;
  }

  .notify-row {
    display: flex;
    border: 1px solid var(--border-gold);
    border-radius: 4px;
    overflow: hidden;
    max-width: 360px;
    width: 100%;
    margin: 0 auto 36px;
  }

  .notify-row input {
    flex: 1;
    border: none;
    background: rgba(200,169,126,0.06);
    padding: 12px 16px;
    font-size: 14px;
    font-family: 'Georgia', serif;
    color: var(--charcoal);
    outline: none;
  }

  .notify-row input::placeholder { color: var(--stone); }

  .notify-row button {
    background: var(--gold);
    border: none;
    padding: 12px 20px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cream);
    cursor: pointer;
    font-family: 'Georgia', serif;
    transition: background 0.2s;
  }

  .notify-row button:hover { background: #b8966a; }

  .footer-note {
    font-size: 12px;
    color: var(--stone);
    letter-spacing: 0.04em;
    opacity: 0.7;
  }

  .stars {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-bottom: 6px;
  }

  .star { width: 10px; height: 10px; }
</style>
</head>
<body>

<div class="bg-dots"></div>

<div class="wrapper">

  <p class="brand">Prime Dental</p>
  <div class="brand-rule"></div>
  <p class="brand-sub">Excellence in every smile</p>

  <h1>Something <em>brilliant</em><br>is coming.</h1>
  <p class="subtitle">We're putting the finishing touches on our new practice. Exceptional dental care, beautifully reimagined.</p>

  <div class="scene" aria-hidden="true">

    <div class="tool tool-left">
      <svg width="40" height="80" viewBox="0 0 40 80" fill="none">
        <rect x="18" y="0" width="4" height="52" rx="2" fill="var(--stone)"/>
        <circle cx="20" cy="60" r="10" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <circle cx="20" cy="60" r="6" fill="none" stroke="var(--gold)" stroke-width="1.2" opacity="0.5"/>
      </svg>
    </div>

    <div class="tool tool-center">
      <svg width="40" height="90" viewBox="0 0 40 90" fill="none">
        <rect x="17" y="0" width="6" height="56" rx="3" fill="var(--charcoal)" opacity="0.7"/>
        <rect x="8" y="50" width="24" height="16" rx="4" fill="var(--charcoal)" opacity="0.85"/>
        <rect x="11" y="54" width="18" height="4" rx="2" fill="var(--gold)" opacity="0.6"/>
      </svg>
    </div>

    <div class="tool tool-right">
      <svg width="40" height="80" viewBox="0 0 40 80" fill="none">
        <rect x="18" y="0" width="4" height="56" rx="2" fill="var(--stone)"/>
        <path d="M20 56 Q26 64 22 72 Q18 78 20 80" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <div class="spark" style="left:148px; bottom:120px; --dx:-12px; --dy:-16px; animation-delay:0.38s; animation-duration:1.4s;"></div>
    <div class="spark" style="left:155px; bottom:130px; --dx:14px; --dy:-12px; animation-delay:0.42s; animation-duration:1.4s; background:var(--mist-dark);"></div>
    <div class="spark" style="left:185px; bottom:118px; --dx:10px; --dy:-18px; animation-delay:0.9s; animation-duration:1.8s;"></div>
    <div class="spark" style="left:190px; bottom:130px; --dx:-12px; --dy:-10px; animation-delay:0.95s; animation-duration:1.8s; background:var(--mist-dark);"></div>
    <div class="spark" style="left:168px; bottom:122px; --dx:0px; --dy:-20px; animation-delay:0.46s; animation-duration:1.6s; width:4px; height:4px;"></div>

    <div class="tooth-svg">
      <svg width="100" height="110" viewBox="0 0 100 110" fill="none">
        <path d="M18 38 C14 20 18 10 28 10 C34 10 38 15 50 15 C62 15 66 10 72 10 C82 10 86 20 82 38 C80 50 74 62 70 78 L60 88 L50 92 L40 88 L30 78 C26 62 20 50 18 38Z" fill="var(--mist)" stroke="var(--mist-dark)" stroke-width="1.5"/>
        <path d="M26 20 C26 16 30 13 34 14" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        <path d="M38 11 C40 10 44 10 46 11" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <path d="M40 88 L38 102" stroke="var(--mist-dark)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M60 88 L62 102" stroke="var(--mist-dark)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M50 92 L50 108" stroke="var(--mist-dark)" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="38" cy="103" rx="4" ry="3" fill="var(--mist-dark)" opacity="0.6"/>
        <ellipse cx="62" cy="103" rx="4" ry="3" fill="var(--mist-dark)" opacity="0.6"/>
        <ellipse cx="50" cy="109" rx="4" ry="3" fill="var(--mist-dark)" opacity="0.6"/>
        <line x1="50" y1="30" x2="50" y2="55" stroke="var(--gold)" stroke-width="1" opacity="0.4"/>
        <line x1="36" y1="42" x2="64" y2="42" stroke="var(--gold)" stroke-width="1" opacity="0.4"/>
      </svg>
    </div>

    <div style="position:absolute; bottom:24px; left:50%; transform:translateX(-50%); width:80px; height:8px; background:rgba(28,28,26,0.08); border-radius:50%; filter:blur(3px);"></div>
  </div>

  <div class="divider"></div>

  <span class="notify-label">Stay in the loop</span>

  <div class="notify-row">
    <input type="email" placeholder="your@email.com" />
    <button>Notify me</button>
  </div>

  <div class="stars">
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity="0.9"/></svg>
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity="0.9"/></svg>
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity="0.9"/></svg>
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity="0.9"/></svg>
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity="0.9"/></svg>
  </div>
  <p class="footer-note">© 2026 Prime Dental · Opening Soon</p>

</div>

<script>
  const btn = document.querySelector('.notify-row button');
  const input = document.querySelector('.notify-row input');
  btn.addEventListener('click', () => {
    if (input.value.includes('@')) {
      btn.textContent = '✓ Saved';
      btn.style.background = '#8a7055';
      input.value = '';
      input.placeholder = "You're on the list!";
    }
  });

  const tooth = document.querySelector('.tooth-svg');
  const impacts = [
    { delay: 0 * 1600 + 0.35 * 1600, interval: 1600 },
    { delay: 400 + 0.35 * 1800, interval: 1800 },
    { delay: 900 + 0.38 * 1400, interval: 1400 },
  ];

  impacts.forEach(({ delay, interval }) => {
    setTimeout(() => {
      const shake = () => {
        tooth.style.transition = 'transform 0.04s';
        tooth.style.transform = 'translateX(-50%) scale(0.96)';
        setTimeout(() => {
          tooth.style.transform = 'translateX(-50%) scale(1.02)';
          setTimeout(() => {
            tooth.style.transform = 'translateX(-50%) scale(1)';
          }, 60);
        }, 50);
      };
      shake();
      setInterval(shake, interval);
    }, delay);
  });
</script>
</body>
</html>
