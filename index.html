<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Dental — See You Soon!</title>
<style>
  :root {
    --cream: #F5F2EE;
    --charcoal: #1C1C1A;
    --gold: #C8A97E;
    --stone: #9B9088;
    --mist: #E8E4DF;
    --mist-dark: #D8D3CC;
    --border: rgba(28,28,26,0.12);
    --border-gold: rgba(200,169,126,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background-color: var(--cream);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--charcoal);
  }

  .bg-dots {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px;
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .brand {
    font-size: clamp(28px, 5vw, 42px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--charcoal);
    font-weight: 400;
    line-height: 1;
    margin-bottom: 4px;
  }

  .brand-rule {
    width: 220px;
    height: 1px;
    background: var(--border-gold);
    margin: 10px auto;
  }

  .brand-sub {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
  }

  h1 {
    font-size: clamp(20px, 3.5vw, 30px);
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  h1 em { font-style: italic; color: var(--gold); }

  .subtitle {
    font-size: 13px;
    color: var(--stone);
    line-height: 1.65;
    max-width: 320px;
    margin-bottom: 28px;
  }

  /* SCENE */
  .scene {
    position: relative;
    width: 260px;
    height: 190px;
    margin-bottom: 28px;
  }

  .tooth-svg {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
  }

  .tool { position: absolute; transform-origin: top center; }

  .tool-left  { left: 28px;  top: -8px;  animation: smashLeft   1.6s linear infinite; }
  .tool-right { right: 28px; top: -8px;  animation: smashRight  1.8s linear infinite 0.4s; }
  .tool-center { left: 50%; margin-left: -15px; top: -14px; animation: smashCenter 1.4s linear infinite 0.9s; }

  @keyframes smashLeft {
    0%,100% { transform: translateY(-24px) rotate(-15deg); opacity: .4; }
    35%,55% { transform: translateY(88px)  rotate(-15deg); opacity: 1; }
    45%     { transform: translateY(84px)  rotate(-15deg); opacity: 1; }
    90%     { transform: translateY(-24px) rotate(-15deg); opacity: .4; }
  }
  @keyframes smashRight {
    0%,100% { transform: translateY(-24px) rotate(15deg); opacity: .4; }
    35%,55% { transform: translateY(80px)  rotate(15deg); opacity: 1; }
    45%     { transform: translateY(76px)  rotate(15deg); opacity: 1; }
    90%     { transform: translateY(-24px) rotate(15deg); opacity: .4; }
  }
  @keyframes smashCenter {
    0%,100% { transform: translateY(-32px) scaleX(1); opacity: .3; }
    38%,58% { transform: translateY(74px)  scaleX(1); opacity: 1; }
    48%     { transform: translateY(70px)  scaleX(1.05); opacity: 1; }
    92%     { transform: translateY(-32px) scaleX(1); opacity: .3; }
  }

  .spark {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    animation: sparkle 1.6s ease-out infinite;
  }
  @keyframes sparkle {
    0%  { opacity: 0; transform: scale(0) translate(0,0); }
    40% { opacity: 1; transform: scale(1) translate(0,0); }
    80% { opacity: 0; transform: scale(.3) translate(var(--dx), var(--dy)); }
    100%{ opacity: 0; }
  }

  .divider {
    width: 36px; height: 1px;
    background: var(--border-gold);
    margin: 0 auto 20px;
  }

  .notify-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 10px;
    display: block;
  }

  .notify-row {
    display: flex;
    border: 1px solid var(--border-gold);
    border-radius: 4px;
    overflow: hidden;
    max-width: 320px;
    width: 100%;
    margin: 0 auto 24px;
  }

  .notify-row input {
    flex: 1;
    border: none;
    background: rgba(200,169,126,0.06);
    padding: 10px 14px;
    font-size: 13px;
    font-family: 'Georgia', serif;
    color: var(--charcoal);
    outline: none;
  }
  .notify-row input::placeholder { color: var(--stone); }

  .notify-row button {
    background: var(--gold);
    border: none;
    padding: 10px 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cream);
    cursor: pointer;
    font-family: 'Georgia', serif;
    transition: background .2s;
    white-space: nowrap;
  }
  .notify-row button:hover { background: #b8966a; }

  .stars { display: flex; gap: 3px; justify-content: center; margin-bottom: 5px; }
  .star  { width: 9px; height: 9px; }

  .footer-note {
    font-size: 11px;
    color: var(--stone);
    letter-spacing: .04em;
    opacity: .7;
  }

  @media (max-width: 480px) {
    .wrapper { padding: 24px 16px; }
    .scene   { width: 220px; height: 160px; }
    .tool-left  { left: 18px; }
    .tool-right { right: 18px; }
  }
</style>
</head>
<body>
<div class="bg-dots"></div>

<div class="wrapper">

  <p class="brand">Prime Dental</p>
  <div class="brand-rule"></div>
  <p class="brand-sub">Trust · Excellence · Care</p>

  <h1>Something <em>brilliant</em><br>is coming.</h1>
  <p class="subtitle">We're putting the finishing touches on our new practice. Exceptional dental care, beautifully reimagined.</p>

  <div class="scene" aria-hidden="true">

    <div class="tool tool-left">
      <svg width="30" height="62" viewBox="0 0 30 62" fill="none">
        <rect x="13" y="0" width="4" height="40" rx="2" fill="var(--stone)"/>
        <circle cx="15" cy="48" r="8" fill="none" stroke="var(--gold)" stroke-width="1.8"/>
        <circle cx="15" cy="48" r="4.5" fill="none" stroke="var(--gold)" stroke-width="1" opacity=".5"/>
      </svg>
    </div>

    <div class="tool tool-center">
      <svg width="30" height="68" viewBox="0 0 30 68" fill="none">
        <rect x="12" y="0" width="6" height="42" rx="3" fill="var(--charcoal)" opacity=".7"/>
        <rect x="5" y="38" width="20" height="13" rx="3" fill="var(--charcoal)" opacity=".85"/>
        <rect x="8" y="42" width="14" height="3" rx="1.5" fill="var(--gold)" opacity=".6"/>
      </svg>
    </div>

    <div class="tool tool-right">
      <svg width="30" height="62" viewBox="0 0 30 62" fill="none">
        <rect x="13" y="0" width="4" height="42" rx="2" fill="var(--stone)"/>
        <path d="M15 42 Q20 49 17 55 Q14 60 15 62" stroke="var(--gold)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <div class="spark" style="left:108px;bottom:88px;--dx:-10px;--dy:-13px;animation-delay:.38s;animation-duration:1.4s;"></div>
    <div class="spark" style="left:114px;bottom:96px;--dx:11px;--dy:-10px;animation-delay:.42s;animation-duration:1.4s;background:var(--mist-dark);"></div>
    <div class="spark" style="left:138px;bottom:86px;--dx:9px;--dy:-14px;animation-delay:.9s;animation-duration:1.8s;"></div>
    <div class="spark" style="left:143px;bottom:96px;--dx:-10px;--dy:-8px;animation-delay:.95s;animation-duration:1.8s;background:var(--mist-dark);"></div>
    <div class="spark" style="left:124px;bottom:90px;--dx:0;--dy:-16px;animation-delay:.46s;animation-duration:1.6s;width:3px;height:3px;"></div>

    <div class="tooth-svg">
      <svg width="76" height="84" viewBox="0 0 100 110" fill="none">
        <path d="M18 38 C14 20 18 10 28 10 C34 10 38 15 50 15 C62 15 66 10 72 10 C82 10 86 20 82 38 C80 50 74 62 70 78 L60 88 L50 92 L40 88 L30 78 C26 62 20 50 18 38Z" fill="var(--mist)" stroke="var(--mist-dark)" stroke-width="1.5"/>
        <path d="M26 20 C26 16 30 13 34 14" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".8"/>
        <path d="M38 11 C40 10 44 10 46 11" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        <path d="M40 88 L38 102" stroke="var(--mist-dark)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M60 88 L62 102" stroke="var(--mist-dark)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M50 92 L50 108" stroke="var(--mist-dark)" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="38" cy="103" rx="4" ry="3" fill="var(--mist-dark)" opacity=".6"/>
        <ellipse cx="62" cy="103" rx="4" ry="3" fill="var(--mist-dark)" opacity=".6"/>
        <ellipse cx="50" cy="109" rx="4" ry="3" fill="var(--mist-dark)" opacity=".6"/>
        <line x1="50" y1="30" x2="50" y2="55" stroke="var(--gold)" stroke-width="1" opacity=".4"/>
        <line x1="36" y1="42" x2="64" y2="42" stroke="var(--gold)" stroke-width="1" opacity=".4"/>
      </svg>
    </div>

    <div style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:60px;height:6px;background:rgba(28,28,26,0.07);border-radius:50%;filter:blur(2px);"></div>
  </div>

  <div class="divider"></div>
  <span class="notify-label">Stay in the loop</span>

  <div class="notify-row">
    <input type="email" placeholder="your@email.com" />
    <button>Notify me</button>
  </div>

  <div class="stars">
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity=".9"/></svg>
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity=".9"/></svg>
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity=".9"/></svg>
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity=".9"/></svg>
    <svg class="star" viewBox="0 0 10 10"><polygon points="5,1 6.2,3.8 9,4.1 6.9,6 7.6,9 5,7.5 2.4,9 3.1,6 1,4.1 3.8,3.8" fill="var(--gold)" opacity=".9"/></svg>
  </div>
  <p class="footer-note">© 2026 Prime Dental · Opening Soon</p>

</div>

<script>
  const btn = document.querySelector('.notify-row button');
  const input = document.querySelector('.notify-row input');
  btn.addEventListener('click', () => {
    if (input.value.includes('@')) {
      btn.textContent = '✓ Saved';
      btn.style.background = '#8a7055';
      input.value = '';
      input.placeholder = "You're on the list!";
    }
  });

  const tooth = document.querySelector('.tooth-svg');
  [{ delay: 560, interval: 1600 }, { delay: 1120, interval: 1800 }, { delay: 1432, interval: 1400 }]
    .forEach(({ delay, interval }) => {
      setTimeout(() => {
        const shake = () => {
          tooth.style.transition = 'transform 0.04s';
          tooth.style.transform = 'translateX(-50%) scale(0.96)';
          setTimeout(() => {
            tooth.style.transform = 'translateX(-50%) scale(1.02)';
            setTimeout(() => { tooth.style.transform = 'translateX(-50%) scale(1)'; }, 60);
          }, 50);
        };
        shake();
        setInterval(shake, interval);
      }, delay);
    });
</script>
</body>
</html>
