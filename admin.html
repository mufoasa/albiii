<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clinic Admin</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#1C1C1A;
  color:#F5F2EE;
}

#calendar {
  background:white;
  color:black;
  padding:10px;
  border-radius:10px;
}

button {
  cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" style="max-width:320px;margin:120px auto;display:flex;flex-direction:column;gap:10px;">
  <h2 style="color:#C8A97E;">Admin Login</h2>

  <input id="email" placeholder="Email" type="email" style="padding:10px;">
  <input id="password" placeholder="Password" type="password" style="padding:10px;">

  <button onclick="login()" style="padding:10px;background:#C8A97E;border:none;">
    Login
  </button>

  <p id="msg"></p>
</div>

<!-- DASHBOARD -->
<div id="panel" style="display:none;">

<div style="display:flex;min-height:100vh;">

<!-- SIDEBAR -->
<div style="width:220px;padding:20px;border-right:1px solid #333;">
  <h3 style="color:#C8A97E;">Clinic Admin</h3>

  <button onclick="loadData()" style="width:100%;margin:5px;">All</button>
  <button onclick="loadToday()" style="width:100%;margin:5px;">Today</button>
  <button onclick="logout()" style="width:100%;margin-top:20px;">Logout</button>
</div>

<!-- MAIN -->
<div style="flex:1;padding:20px;">

<h1>Appointments</h1>

<!-- CALENDAR -->
<div style="display:flex;gap:20px;margin-bottom:20px;">

  <div style="flex:2;">
    <div id="calendar"></div>
  </div>

  <div style="flex:1;background:#222;padding:10px;">
    <h3>Day View</h3>
    <div id="dayAppointments">Click a date</div>
  </div>

</div>

<!-- TABLE -->
<table style="width:100%;border-collapse:collapse;">
<thead>
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Email</th>
  <th>Date</th>
  <th>Time</th>
  <th>Status</th>
  <th>Action</th>
</tr>
</thead>

<tbody id="data"></tbody>
</table>

</div>
</div>
</div>

<script>
const supabase = supabaseJs.createClient(
  "https://iwiwclbbflmykpklzgfj.supabase.co",
  "sb_publishable_BRXsPkWLiAJq18wHAqndgw_bpQvo4Gu"
);

let calendar;
let allAppointments = [];

/* LOGIN */
async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({
    email, password
  });

  if (error) {
    document.getElementById("msg").innerText = error.message;
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("panel").style.display="block";

  loadData();
  loadCalendar();
}

/* LOAD */
async function loadData() {

  const { data } = await supabase
    .from("appointments")
    .select("*")
    .order("appointment_date", { ascending:true });

  render(data);
}

/* TODAY */
async function loadToday() {

  const today = new Date().toISOString().split("T")[0];

  const { data } = await supabase
    .from("appointments")
    .select("*")
    .eq("appointment_date", today);

  render(data);
}

/* RENDER */
function render(data) {

  const tbody = document.getElementById("data");
  tbody.innerHTML = "";

  data.forEach(a => {

    const colors = {
      pending:"#f0ad4e",
      confirmed:"#28a745",
      completed:"#17a2b8",
      cancelled:"#dc3545"
    };

    tbody.innerHTML += `
    <tr>

      <td>${a.name}</td>
      <td>${a.phone}</td>
      <td>${a.email}</td>
      <td>${a.appointment_date}</td>
      <td>${a.appointment_time}</td>

      <td style="color:${colors[a.status] || '#fff'};">
        ${a.status || 'pending'}
      </td>

      <td>

        <button onclick="updateStatus(${a.id},'confirmed')">Accept</button>
        <button onclick="updateStatus(${a.id},'completed')">Done</button>
        <button onclick="updateStatus(${a.id},'cancelled')">Cancel</button>
        <button onclick="deleteAppt(${a.id})">Delete</button>

      </td>

    </tr>`;
  });
}

/* UPDATE STATUS */
async function updateStatus(id,status) {

  const { error } = await supabase
    .from("appointments")
    .update({ status })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  loadData();
  loadCalendar();
}

/* DELETE */
async function deleteAppt(id) {

  const { error } = await supabase
    .from("appointments")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  loadData();
  loadCalendar();
}

/* CALENDAR */
async function loadCalendar() {

  const { data } = await supabase
    .from("appointments")
    .select("*");

  allAppointments = data;

  const events = data.map(a => ({
    title: a.name,
    start: a.appointment_date
  }));

  if (calendar) calendar.destroy();

  calendar = new FullCalendar.Calendar(
    document.getElementById("calendar"),
    {
      initialView:"dayGridMonth",
      height:500,
      events,

      dateClick(info){
        showDay(info.dateStr);
      }
    }
  );

  calendar.render();
}

/* DAY VIEW */
function showDay(date) {

  const list = allAppointments.filter(
    a => a.appointment_date === date
  );

  const box = document.getElementById("dayAppointments");

  if (!list.length) {
    box.innerHTML = "No appointments";
    return;
  }

  box.innerHTML = list.map(a => `
    <div style="border:1px solid #444;padding:6px;margin-bottom:6px;">
      <b>${a.name}</b><br>
      ${a.appointment_time}<br>
      ${a.status || 'pending'}
    </div>
  `).join("");
}

/* LOGOUT */
async function logout() {
  await supabase.auth.signOut();
  location.reload();
}
</script>

</body>
</html>
